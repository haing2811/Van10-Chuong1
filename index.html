<script>
/* First visit: follow the system day/night choice; Store wraps localStorage
   in try/catch, so this works even when storage is blocked (memory fallback).
   Later visits read the stored choice. app.js initDisplay() re-reads the same
   value afterwards — no conflict. */
(function () {
  if (!window.Store) return;
  if (Store.get("theme", null) === null) {
    Store.set("theme", window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  document.documentElement.setAttribute("data-theme", Store.get("theme", "light"));
})();
</script>
